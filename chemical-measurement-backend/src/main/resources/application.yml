server:
  port: 8080

spring:
  application:
    name: chemical-measurement-system
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

app:
  mode: ${APP_MODE:prod}

# 生产环境下禁止开发者登录，调试模式（APP_MODE=dev）不受限
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath:mapper/*.xml

knife4j:
  enable: true
  setting:
    language: zh_cn

jwt:
  secret: ${JWT_SECRET:please-set-JWT_SECRET-env-var-in-production-32bytes}
  expiration: 86400000

ocr:
  config-file: classpath:ocr-config.yml
