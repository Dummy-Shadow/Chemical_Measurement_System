server:
  port: 8080

spring:
  application:
    name: chemical-measurement-system
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath:mapper/*.xml

knife4j:
  enable: true
  setting:
    language: zh_cn

jwt:
  secret: pfep-cms-jwt-secret-key-2026-chemical-measurement-system
  expiration: 86400000

ocr:
  config-file: classpath:ocr-config.yml
